name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides what a pull request needs from the files it changes: the tests of the changed packages and
  # their dependents, and the jobs those files touch. The release pull request (from release/main)
  # runs everything with coverage, once before each release. A push to main was checked on its pull
  # request, so it only type-checks, lints and builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.diff.outputs.release }}
      tests: ${{ steps.diff.outputs.tests }}
      desktop: ${{ steps.diff.outputs.desktop }}
      plugin: ${{ steps.diff.outputs.plugin }}
      database: ${{ steps.diff.outputs.database }}
      image: ${{ steps.diff.outputs.image }}
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jobs="desktop plugin database image terraform"
          if [ "$EVENT" != pull_request ]; then
            { echo "release=false"; echo "tests="; for job in $jobs; do echo "$job=false"; done; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_REF" = release/main ]; then
            { echo "release=true"; echo "tests=everything"; for job in $jobs; do echo "$job=true"; done; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig[^/]*\.json|\.github/workflows/ci\.yml)$'
          core='^packages/(kernel|protocol|sprites|client|cli|mcp)/'
          matches() { if echo "$files" | grep -Eq "$1|$shared"; then echo true; else echo false; fi; }
          {
            echo "release=false"
            echo "tests=$(echo "$files" | node scripts/affected-tests.ts)"
            echo "desktop=$(matches "$core|^scripts/service-smoke\.ts$")"
            echo "plugin=$(matches "$core|^packages/plugin/")"
            echo "database=$(matches "$core|^packages/(a2a|dovecote)/")"
            echo "image=$(matches "^packages/(kernel|protocol|sprites|client|cli|mcp|a2a|dovecote|ui|pwa)/|^Dockerfile$|^\.dockerignore$")"
            echo "terraform=$(matches '^deploy/terraform/')"
          } >> "$GITHUB_OUTPUT"

  check:
    name: check on Node ${{ matrix.node }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.changes.outputs.release == 'true' && '[22, 24]' || '[24]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests with coverage, before a release
        if: needs.changes.outputs.release == 'true'
        run: pnpm test:coverage
      - name: Every test, when a shared file changed
        if: needs.changes.outputs.release != 'true' && needs.changes.outputs.tests == 'everything'
        run: pnpm test
      - name: The tests of the changed packages and their dependents
        if: needs.changes.outputs.release != 'true' && needs.changes.outputs.tests != 'everything' && needs.changes.outputs.tests != ''
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: pnpm exec vitest run $TESTS
      - run: pnpm build

  desktop:
    name: cli, mcp and service on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run packages/cli/ packages/mcp/
      # Installs the real launchd agent or Run key entry for this runner's user, then removes it.
      - run: pnpm exec tsx scripts/service-smoke.ts 8191

  plugin:
    name: plugin validate and tests
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The validator and the plugin test kit run offline against a mocked host: no API key is needed.
      - run: npm install --global @anthropic-ai/claude-code@2.1.328
      - run: pnpm test:plugin

  database:
    name: dovecote on ${{ matrix.database }} (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each shard is its own job with its own database, so the files of one shard still run one at a
      # time while the three shards run side by side.
      matrix:
        database: [postgres, mysql]
        shard: [1, 2, 3]
        include:
          - database: postgres
            image: postgres:16
            port: 5432
            url: postgres://homingbird:homingbird@localhost:5432/homingbird
            url_variable: HB_TEST_POSTGRES_URL
            health: --health-cmd "pg_isready -U homingbird" --health-interval 5s --health-timeout 3s --health-retries 20
          - database: mysql
            image: mysql:8
            port: 3306
            url: mysql://homingbird:homingbird@localhost:3306/homingbird
            url_variable: HB_TEST_MYSQL_URL
            health: --health-cmd "mysqladmin ping -h 127.0.0.1 -u homingbird -phomingbird" --health-interval 5s --health-timeout 3s --health-retries 30
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: homingbird
          POSTGRES_PASSWORD: homingbird
          POSTGRES_DB: homingbird
          MYSQL_USER: homingbird
          MYSQL_PASSWORD: homingbird
          MYSQL_DATABASE: homingbird
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.health }}
    env:
      HB_TEST_DATABASE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every test drops and recreates the tables of the one shared database, so files must run one at a time.
      - run: ${{ matrix.url_variable }}=${{ matrix.url }} npx vitest run packages/dovecote/ --no-file-parallelism --shard=${{ matrix.shard }}/3

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git log --no-merges --format='%B%x00' "$BASE_SHA..HEAD" | node scripts/check-commit-message.ts -

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t homingbird:ci .
      - name: Start the image and wait for it to report healthy
        run: |
          docker run -d --name dovecote -p 8080:8080 \
            -e HB_PUBLIC_URL=http://localhost:8080 -e HB_DEV_LOGIN=1 -e HB_ALLOWED_DOMAINS=example.com homingbird:ci
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs dovecote
          exit 1

  terraform:
    name: terraform ${{ matrix.setup }}
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        setup: [gcp, aws]
    defaults:
      run:
        working-directory: deploy/terraform/${{ matrix.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
