name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homingbird
          POSTGRES_PASSWORD: homingbird
          POSTGRES_DB: homingbird
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homingbird"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: homingbird
          MYSQL_PASSWORD: homingbird
          MYSQL_DATABASE: homingbird
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u homingbird -phomingbird"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      HB_TEST_POSTGRES_URL: postgres://homingbird:homingbird@localhost:5432/homingbird
      HB_TEST_MYSQL_URL: mysql://homingbird:homingbird@localhost:3306/homingbird
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t homingbird:ci .
      - name: Start the image and wait for it to report healthy
        run: |
          docker run -d --name dovecote -p 8080:8080 \
            -e HB_PUBLIC_URL=http://localhost:8080 -e HB_DEV_LOGIN=1 -e HB_ALLOWED_DOMAINS=example.com homingbird:ci
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs dovecote
          exit 1
