# Pick one database with a profile:
#   docker compose --profile sqlite up
#   docker compose --profile postgres up
#   docker compose --profile mysql up
# Set HB_PUBLIC_URL, HB_OIDC_CLIENT_ID, HB_OIDC_CLIENT_SECRET and HB_ALLOWED_DOMAINS in a .env file.

x-dovecote: &dovecote
  build: .
  image: ghcr.io/let-sunny/homingbird
  restart: unless-stopped
  ports:
    - "8080:8080"
  environment: &environment
    HB_PUBLIC_URL: ${HB_PUBLIC_URL:?set HB_PUBLIC_URL}
    HB_OIDC_ISSUER: ${HB_OIDC_ISSUER:-https://accounts.google.com}
    HB_OIDC_CLIENT_ID: ${HB_OIDC_CLIENT_ID:-}
    HB_OIDC_CLIENT_SECRET: ${HB_OIDC_CLIENT_SECRET:-}
    HB_ALLOWED_DOMAINS: ${HB_ALLOWED_DOMAINS:-}
    HB_ADMIN_EMAILS: ${HB_ADMIN_EMAILS:-}
    HB_CONTACT_MODE: ${HB_CONTACT_MODE:-open}
    HB_TRUST_PROXY: ${HB_TRUST_PROXY:-0}
    HB_DEV_LOGIN: ${HB_DEV_LOGIN:-0}

services:
  dovecote-sqlite:
    <<: *dovecote
    profiles: [sqlite]
    volumes:
      - dovecote-data:/data

  dovecote-postgres:
    <<: *dovecote
    profiles: [postgres]
    environment:
      <<: *environment
      HB_DATABASE_URL: postgres://homingbird:${DATABASE_PASSWORD:-homingbird}@postgres:5432/homingbird
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: homingbird
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-homingbird}
      POSTGRES_DB: homingbird
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homingbird"]
      interval: 5s
      timeout: 3s
      retries: 20

  dovecote-mysql:
    <<: *dovecote
    profiles: [mysql]
    environment:
      <<: *environment
      HB_DATABASE_URL: mysql://homingbird:${DATABASE_PASSWORD:-homingbird}@mysql:3306/homingbird
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_USER: homingbird
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-homingbird}
      MYSQL_DATABASE: homingbird
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u homingbird -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  dovecote-data:
  postgres-data:
  mysql-data:
