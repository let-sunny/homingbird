# Copy .env.example to .env and fill it in; the whole file reaches the server.
# SQLite in a volume:     docker compose up -d
# PostgreSQL instead:     HB_DATABASE_URL=postgres://homingbird:homingbird@postgres:5432/homingbird docker compose --profile postgres up -d

services:
  dovecote:
    build: .
    image: ghcr.io/let-sunny/homingbird
    restart: unless-stopped
    # Plain HTTP, on this host only: put a TLS proxy on the same host in front of 127.0.0.1:8080.
    # Publish on every interface ("8080:8080") only when a proxy on another host must reach it, with a
    # firewall that admits that proxy alone, and never with HB_DEV_LOGIN=1.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      HB_PUBLIC_URL: ${HB_PUBLIC_URL:?set HB_PUBLIC_URL in .env}
      HB_DATABASE_URL: ${HB_DATABASE_URL:-sqlite:/data/dovecote.sqlite}
    volumes:
      - dovecote-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: homingbird
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-homingbird}
      POSTGRES_DB: homingbird
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homingbird"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dovecote-data:
  postgres-data:
